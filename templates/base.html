{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Espacio de trabajo{% endblock %} | CM</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'catalogo:inicio' %}"><span>CM</span> Espacio de trabajo</a>
        <nav class="nav-links" aria-label="Navegación principal">
            <a href="{% url 'catalogo:inicio' %}">Catálogo</a>
            <a href="{% url 'catalogo:productos' %}">Inventario</a>
            <a href="{% url 'agenda:inicio' %}">Agenda</a>
            <a href="{% url 'agenda:semana' %}">Semana</a>
        </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer class="site-footer">Proyecto Django · Cristobal Montecinos · Primavera 2026</footer>
</body>
</html>
